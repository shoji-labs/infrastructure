name: Shared .NET CI

# Reusable workflow: build + test on every platform pwsh 7 runs on.
# macOS runs on pushes to main only - the org is private, a macOS minute
# costs ten Linux minutes, and the self-hosted Mac (label macos-latest)
# takes these jobs when online. See infrastructure/README.md.
#
# PR callers must trigger with pull_request_target: GitHub cannot resolve a
# private cross-repo reusable workflow from a plain pull_request run, and the
# checkout below pins the PR's own commit. Safe for this org: only a single
# trusted author pushes branches, no forks.

on:
  workflow_call:
    inputs:
      dotnet-versions:
        description: 'Multiline dotnet-version input for setup-dotnet.'
        type: string
        required: false
        default: |
          8.0.x
          10.0.x
      macos-on-main:
        description: 'Add a macOS job on pushes to main.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ contains(fromJSON('["pull_request", "pull_request_target"]'), github.event_name) && fromJSON('["windows-latest", "ubuntu-latest"]') || (inputs['macos-on-main'] && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target checks out the base by default; test the PR.
          # Not refs/pull/N/merge: GitHub updates the merge ref asynchronously,
          # so a run started by the push checks out a stale merge and tests
          # yesterday's code (observed: head_sha at the tip, HEAD at the
          # previous push). The PR's head commit exists the moment the event
          # fires; main's own push run verifies the merged result.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-versions }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build
