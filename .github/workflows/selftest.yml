name: Self-test shared workflows

# Proves the dotnet-ci reusable workflow parses and runs, called from this
# repo by relative path (content) and by remote org path (reference form).
# Remove after the consumer repos' first green CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-call:
    uses: ./.github/workflows/dotnet-ci.yml
  remote-call:
    uses: shoji-labs/infrastructure/.github/workflows/dotnet-ci.yml@main
